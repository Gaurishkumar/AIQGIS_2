# AI Building Polygon Automation - project configuration.
#
# Every weight and threshold here is an INITIAL value (Final MVP Specification,
# Section 6) to be calibrated on ground truth during the pilot. A frozen copy of
# this file is written into every batch folder so results stay reproducible.

config_version: "2026.09-mvp.1"

project:
  name: "AI Building Polygon Automation"
  # Survey points outside these bounds are INVALID. Default: India.
  country_bounds: {min_lat: 6.0, max_lat: 37.6, min_lon: 68.0, max_lon: 97.5}

# --------------------------------------------------------------------------
# S1 - Excel import. Internal field -> source column header (exact text).
# Original column names are never renamed. When a header appears twice the
# FIRST occurrence is used; "@U" style values address a column letter directly.
# --------------------------------------------------------------------------
excel:
  sheet_name: "Sheet1"
  header_row: 1
  columns:
    survey_id: "Survey ID"
    latitude: "latitude"
    longitude: "longitude"
    customer_name: "Customer Name"
    building_name: "Building Name"
    building_no: "Building No"
    tower_block: "Tower/Block"
    street: "Street Name"
    sector: "Sector/Phase"
    area: "Area Name"
    landmark: "Landmark"
    city: "City"
    district: "District Name"
    state: "State Name"
    pincode: "pincode"
    standard_address: "Standard Building Address"
    building_type: "Building Type"
    building_category: "Building Category"
    building_height_m: "Building Height(m)"
    floors: "Floors"
  # Existing columns of the client template that the export fills in.
  client_output_columns:
    remark: "Location coordinates change remark"
    corrected_latlon: "Correct and Correeted Lat &long"
    operator_name: "Name"
    status: "Status"
    delivery_date: "Delivery Date"
  # Other spellings accepted when the configured header is not found (case/spacing ignored).
  column_aliases:
    survey_id: ["Survey Id", "SurveyID", "Survey No", "Survey Number", "ID"]
    latitude: ["lat", "Latitude", "Lat.", "Y"]
    longitude: ["lon", "lng", "long", "Longitude", "Long.", "X"]
    building_name: ["Building", "Bldg Name", "Name of Building"]
    street: ["Street", "Road", "Road Name"]
    pincode: ["Pin Code", "PIN", "Postal Code", "Pincode"]
  # Template/control columns that must never be read as data (matched by header text,
  # so a workbook with a different column layout is not affected). "(2)" = second
  # column with the same header (the remark drop-down option list).
  control_columns: ["Don't Remove This Data", "Location coordinates change remark (2)"]
  # Exact option texts of the client's remark drop-down (column AB list).
  remarks:
    unchanged: "Existing client coordinates are accurate and no changes are required."
    modified: "Latitude and longitude have been modified based on GSM validation"
    adjusted_near: "Client-provided coordinates were positioned near the existing building location; hence GSM coordinates have been adjusted and updated accordingly"
  remark_rules:
    unchanged_max_shift_m: 1.0     # corrected point within 1 m of original -> "unchanged"
    near_max_distance_m: 30.0      # original within 30 m of final polygon -> "adjusted_near", else "modified"
  corrected_latlon_format: "{lat:.6f},{lon:.6f}"
  status_values:
    APPROVED: "Completed"
    APPROVED_MANUAL: "Completed"
    AUTO_ACCEPTED: "Completed"
  delivery_date_format: "DD-MM-YYYY"
  # Appended after the last template column (S11 output columns + audit metadata).
  appended_columns:
    corrected_latitude: "Corrected Latitude"
    corrected_longitude: "Corrected Longitude"
    polygon_id: "Building Polygon ID"
    area_m2: "Building Area (m2)"
    method: "Detection Method"
    confidence: "Detection Confidence"
    route: "Route"
    review_status: "Review Status"
    reviewer: "Reviewer"
    reviewed_at: "Reviewed At"
    exported_at: "Exported At"
    coordinate_strategy: "Corrected Coordinate Strategy"
    footprint_source: "Footprint Source"
    imagery_source: "Imagery Source"
    config_version: "Config Version"
    model_version: "Model Version"
    manifest_hash: "Reference Manifest Hash"

# --------------------------------------------------------------------------
# S0 - Offline reference data (downloaded once per region, never per record).
# --------------------------------------------------------------------------
reference:
  dir: "data/reference"
  files:
    buildings: "overture_buildings.parquet"
    segments: "overture_segments.parquet"
    places: "overture_places.parquet"
    addresses: "overture_addresses.parquet"
    historic: "historic.gpkg"          # client historic polygons (optional)
    heights: "heights.tif"             # Open Buildings 2.5D heights (optional)
  verify_manifest: true
  prepare:
    margin_m: 1000                     # spec: survey bbox + 1 km
    bbox_mode: "clusters"              # "project" = one bbox; "clusters" = bbox per point cluster (+margin)
    cluster_link_m: 3000
    types: ["building", "segment", "place", "address"]
    # A survey point counts as covered when this much reference data surrounds it.
    # New workbooks only download areas that are not covered yet (incremental S0).
    coverage_margin_m: 300

# --------------------------------------------------------------------------
# S3 - Candidate generation
# --------------------------------------------------------------------------
candidates:
  search_radius_m: 50                  # until measured from ground truth
  radius_clamp_m: [25, 100]
  dedup_iou: 0.5
  max_candidates: 100
  # Worst case (GPS far off): when nothing nearby carries the building name, search
  # this far for a place/building with that name (further when the coordinate looks
  # truncated). Found buildings are offered as candidates, never auto-accepted.
  name_search_radius_m: 300
  name_search_low_precision_m: 3000
  name_search_min_similarity: 0.9
  name_search_max_results: 3

# --------------------------------------------------------------------------
# S4 - Scoring and decision (Section 6)
# --------------------------------------------------------------------------
scoring:
  weights: {s_dist: 0.40, s_name: 0.20, s_addr: 0.10, s_road: 0.15, s_plaus: 0.10, s_source: 0.05}
  dist_decay_m: 15.0
  name_places_within_m: 10.0
  # Fuzzy similarity below this is treated as no evidence (0 = spec formula verbatim);
  # with text_ramp the remainder is rescaled to 0..1 so borderline matches weigh little.
  text_noise_floor: 0.6
  text_ramp: true
  # s_addr only counts when the candidate address names the survey street; a candidate
  # without any address data gets this neutral value instead of 0 (no evidence either way).
  addr_requires_street: true
  addr_missing_value: 0.5
  # The customer's own outlet (bank branch / ATM / store from the Customer Name column) in or
  # within name_places_within_m of a building counts as name evidence for it (max with s_name).
  customer_place_evidence: true
  road_match_within_m: 20.0
  road_point_ignore_m: 5.0
  # A survey point on the carriageway says nothing about the side: crossings of a road are
  # ignored within max(road_point_ignore_m, half width + 1 m) of its centre line.
  road_half_width_m: {motorway: 15, trunk: 12, primary: 10, secondary: 8, tertiary: 6,
                      residential: 4, unclassified: 4, living_street: 3}
  road_name_match_threshold: 0.8
  road_search_extra_m: 60.0
  crossing_road_classes: [motorway, trunk, primary, secondary, tertiary, residential, unclassified, living_street]
  source_trust:
    historic: 1.0
    OpenStreetMap: 0.8
    Esri Community Maps: 0.8
    Microsoft ML Buildings: 0.6
    Google Open Buildings: 0.6
    default: 0.6
  decision:
    min_top_score: 0.70
    min_margin: 0.15
    historic_clear_distance_m: 5.0
    # Survey point on a road carriageway: IDENTITY_CLEAR also needs s_name >= this
    # (or a historic polygon). null disables the rule.
    on_road_min_name: 0.5
    # A building found by name away from the point (worst case) only outranks the
    # buildings near the point when the best of those scores below this.
    far_name_override_below: 0.45
  calibration_file: null               # fitted identity model (calibration.py)

text:
  abbreviations:
    apt: apartment
    apts: apartments
    appt: apartment
    aptmt: apartment
    bldg: building
    bldgs: buildings
    bld: building
    soc: society
    socy: society
    chs: cooperative housing society
    chsl: cooperative housing society limited
    hsg: housing
    coop: cooperative
    co-op: cooperative
    rd: road
    marg: road
    mg: mahatma gandhi
    nr: near
    opp: opposite
    twr: tower
    blk: block
    sec: sector
    ph: phase
    compl: complex
    cmplx: complex
    ind: industrial
    indl: industrial
    est: estate
    estt: estate
    ltd: limited
    pvt: private
    ngr: nagar
    e: east
    w: west
  # Words that describe the building type rather than identify it; removed
  # before name matching so "X Apartment" does not match every "Y Apartment".
  generic_name_tokens: [apartment, apartments, building, buildings, tower, towers, society, cooperative,
                        housing, limited, private, complex, residency, residence, heights, plaza, the, and,
                        of, wing, block, plot, no, number, unit, shop, flat, floor, co, op, sector, phase,
                        estate, industrial, near, opposite, commercial, bank, atm, branch]
  # Customer names: legal and outlet words are ignored ("ICICI Bank Limited" = "ICICI Bank ATM").
  organisation_ignore_tokens: [limited, private, the, cooperative, co, op, operative, company, corporation, corp,
                               inc, llp, sahakari, atm, atms, branch, br, office, main, cash, deposit, machine,
                               cdm, kiosk, store, outlet]
  # Short brand names used on map places -> the name used in customer records. Only names that
  # are not ordinary words ("axis" would turn "Axis Mall" into Axis Bank).
  brand_aliases:
    sbi: state bank of india
    hdfc: hdfc bank
    icici: icici bank
    kotak: kotak mahindra bank
    kotak bank: kotak mahindra bank
    idfc first: idfc first bank
    indusind: indusind bank
    idbi: idbi bank
    pnb: punjab national bank
    union bank: union bank of india
    dmart: avenue supermarts
  # Words every street name shares; streets are compared on the remaining words.
  generic_street_tokens: [road, street, lane, path, cross, highway, avenue, way]

# Building plausibility (s_plaus and soft flag)
plausibility:
  category_area_m2:
    "Residential Building": [40, 6000]
    "Commercial Complex": [80, 20000]
    "Community Centre": [50, 8000]
    "IT Park": [300, 20000]
    default: [30, 20000]
  min_area_per_floor_m2: 8.0           # a 10-floor building below 80 m2 footprint is implausible
  floor_height_m: 3.0
  height_tolerance: {abs_m: 6.0, rel: 0.5}
  height_mismatch_factor: 0.5          # multiplies s_plaus; height can only lower a score

# --------------------------------------------------------------------------
# S6 - Imagery. Each source MUST carry an explicit licence decision.
# The worker refuses any source where allow_automated_analysis is false or
# licence_ref is empty. Basemaps for viewing only never belong here.
# --------------------------------------------------------------------------
imagery:
  providers: []
  # Example (disabled until written permission is recorded):
  # - id: client_ortho_2025
  #   type: local_raster               # GeoTIFF / COG / VRT
  #   paths: ["data/imagery/client_ortho_2025.tif"]
  #   allow_automated_analysis: false
  #   licence_ref: ""
  #   capture_date: "2025-01-15"
  #   priority: 1
  # - id: licensed_tiles
  #   type: xyz_tiles
  #   url: "https://tiles.example.com/{z}/{x}/{y}.jpg"
  #   zoom: 19
  #   allow_automated_analysis: false
  #   licence_ref: ""
  crop:
    buffer_m: 15.0
    min_size_m: 60.0
    enlarge_factor: 1.6                # crop-edge retry
    max_edge_retries: 1
    max_pixels: 2048                   # longer crops (sharp drone imagery, big buildings) are resampled
  max_gsd_m: 0.6                       # boundaries need ~0.5 m or finer
  # The AI only traces a building at least this many pixels across (short side); smaller ones keep
  # the map outline. A 10 m house needs <= 0.5 m per pixel, a 100 m warehouse is fine at 0.6 m.
  min_building_px: 20
  max_blank_fraction: 0.25             # crops with more no-data (mosaic gaps, image edge) are refused
  # Imagery added from the plugin ("Add client imagery") is listed here, with its permission record.
  sources_file: "config/imagery_sources.yaml"
  clustering_eps_m: 500.0              # cluster-based purchasing

# --------------------------------------------------------------------------
# S7 - Segmentation (SAM 2.1)
# --------------------------------------------------------------------------
segmentation:
  backend: "auto"                      # auto | sam2 | none
  model: "sam2.1_hiera_base_plus"
  cpu_fallback_model: "sam2.1_hiera_small"
  use_cpu_fallback: false              # set true if the week-1 benchmark requires it
  checkpoints_dir: "data/models"
  device: "auto"                       # auto | cpu | cuda
  torch_threads: 0                     # 0 = torch default
  positive_points: 3
  interior_erosion_m: 2.0
  box_pad_m: 2.0
  embedding_cache_size: 16
  # Final mask = variant with the best offset-tolerant shape fit to the footprint;
  # within this tolerance the box-free variant C is preferred.
  variant_tie_tolerance: 0.02
  auto_mask:
    points_per_side: 16
    min_area_m2: 20.0
    max_area_m2: 20000.0
    min_compactness: 0.35

# --------------------------------------------------------------------------
# S8 - Mask to polygon
# --------------------------------------------------------------------------
polygon:
  min_hole_area_m2: 4.0
  morph_open_px: 1                     # 0 disables the opening
  regularize: true
  regularize_params:
    simplify_px: 1.7                   # pre-regularisation simplify tolerance, in pixels
    parallel_threshold: 1.0
    allow_45_degree: true
    diagonal_threshold_reduction: 15
    allow_circles: false
  simplify_pixel_factor: 0.5

# --------------------------------------------------------------------------
# S9 - Validation gates
# --------------------------------------------------------------------------
validation:
  area_m2: [15.0, 20000.0]
  edge_touch_px: 2
  footprint_agreement_iou: 0.6
  approved_overlap_ratio: 0.10
  sliver_width_m: 1.0
  sliver_loss_ratio: 0.15
  sliver_min_length_m: 4.0             # a thin part longer than this is a spike, whatever its area

# --------------------------------------------------------------------------
# Confidence and routing
# --------------------------------------------------------------------------
confidence:
  historic_identity_prob: 0.95
  geometry_prior: {historic: 0.95, OpenStreetMap: 0.85, Esri Community Maps: 0.85, default: 0.75}
  flag_penalty: 0.85
  calibration_file: null               # fitted record-confidence model

routing:
  shadow_mode: true                    # pilot: every record reviewed
  auto_accept_enabled: false
  t_auto: 0.90
  audit_sample_rate: 0.05

# --------------------------------------------------------------------------
# S10 - Corrected coordinate (client decision before pilot acceptance)
# --------------------------------------------------------------------------
corrected_coordinate:
  strategy: "centroid_if_inside"       # centroid_if_inside | representative_point | snap_to_boundary
  decimals: 6
  keep_original_if_inside: false       # true: point already inside the polygon is kept unchanged

worker:
  host: "127.0.0.1"
  port: 8765
