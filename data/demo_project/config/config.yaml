    - Name of Building
    street:
    - Street
    - Road
    - Road Name
    pincode:
    - Pin Code
    - PIN
    - Postal Code
    - Pincode
  control_columns:
  - Don't Remove This Data
  - Location coordinates change remark (2)
  remarks:
    unchanged: Existing client coordinates are accurate and no changes are required.
    modified: Latitude and longitude have been modified based on GSM validation
    adjusted_near: Client-provided coordinates were positioned near the existing building
      location; hence GSM coordinates have been adjusted and updated accordingly
  remark_rules:
    unchanged_max_shift_m: 1.0
    near_max_distance_m: 30.0
  corrected_latlon_format: '{lat:.6f},{lon:.6f}'
  status_values:
    APPROVED: Completed
    APPROVED_MANUAL: Completed
    AUTO_ACCEPTED: Completed
  delivery_date_format: DD-MM-YYYY
  appended_columns:
    corrected_latitude: Corrected Latitude
    corrected_longitude: Corrected Longitude
    polygon_id: Building Polygon ID
    area_m2: Building Area (m2)
    method: Detection Method
    confidence: Detection Confidence
    route: Route
    review_status: Review Status
    reviewer: Reviewer
    reviewed_at: Reviewed At
    exported_at: Exported At
    coordinate_strategy: Corrected Coordinate Strategy
    footprint_source: Footprint Source
    imagery_source: Imagery Source
    config_version: Config Version
    model_version: Model Version
    manifest_hash: Reference Manifest Hash
reference:
  dir: data/reference
  files:
    buildings: overture_buildings.parquet
    segments: overture_segments.parquet
    places: overture_places.parquet
    addresses: null
    historic: historic.gpkg
    heights: heights.tif
  verify_manifest: true
  prepare:
    margin_m: 1000
    bbox_mode: clusters
    cluster_link_m: 3000
    types:
    - building
    - segment
    - place
    - address
    coverage_margin_m: 300
candidates:
  search_radius_m: 50
  radius_clamp_m:
  - 25
  - 100
  dedup_iou: 0.5
  max_candidates: 100
scoring:
  weights:
    s_dist: 0.4
    s_name: 0.2
    s_addr: 0.1
    s_road: 0.15
    s_plaus: 0.1
    s_source: 0.05
  dist_decay_m: 15.0
  name_places_within_m: 10.0
  text_noise_floor: 0.6
  text_ramp: true
  addr_requires_street: true
  addr_missing_value: 0.5
  road_match_within_m: 20.0
  road_point_ignore_m: 5.0
  road_half_width_m:
    motorway: 15
    trunk: 12
    primary: 10
    secondary: 8
    tertiary: 6
    residential: 4
    unclassified: 4
    living_street: 3
  road_name_match_threshold: 0.8
  road_search_extra_m: 60.0
  crossing_road_classes:
  - motorway
  - trunk
  - primary
  - secondary
  - tertiary
  - residential
  - unclassified
  - living_street
  source_trust:
    historic: 1.0
    OpenStreetMap: 0.8
    Esri Community Maps: 0.8
    Microsoft ML Buildings: 0.6
    Google Open Buildings: 0.6
    default: 0.6
  decision:
    min_top_score: 0.7
    min_margin: 0.15
    historic_clear_distance_m: 5.0
    on_road_min_name: 0.5
  calibration_file: null
text:
  abbreviations:
    apt: apartment
    apts: apartments
    appt: apartment
    aptmt: apartment
    bldg: building
    bldgs: buildings
    bld: building
    soc: society
    socy: society
    chs: cooperative housing society
    chsl: cooperative housing society limited
    hsg: housing
    coop: cooperative
    co-op: cooperative
    rd: road
    marg: road
    mg: mahatma gandhi
    nr: near
    opp: opposite
    twr: tower
    blk: block
