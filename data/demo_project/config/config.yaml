  - plot
  - false
  - number
  - unit
  - shop
  - flat
  - floor
  - co
  - op
  - sector
  - phase
  - estate
  - industrial
  - near
  - opposite
  - commercial
  - bank
  - atm
  - branch
  generic_street_tokens:
  - road
  - street
  - lane
  - path
  - cross
