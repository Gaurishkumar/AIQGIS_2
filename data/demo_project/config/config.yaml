    ph: phase
    compl: complex
    cmplx: complex
    ind: industrial
    indl: industrial
    est: estate
    estt: estate
    ltd: limited
    pvt: private
    ngr: nagar
    e: east
    w: west
  generic_name_tokens:
  - apartment
  - apartments
  - building
  - buildings
  - tower
  - towers
  - society
  - cooperative
  - housing
  - limited
  - private
  - complex
  - residency
  - residence
  - heights
