  - avenue
  - way
plausibility:
  category_area_m2:
    Residential Building:
    - 40
    - 6000
    Commercial Complex:
    - 80
    - 20000
    Community Centre:
    - 50
    - 8000
    IT Park:
    - 300
    - 20000
    default:
    - 30
    - 20000
  min_area_per_floor_m2: 8.0
  floor_height_m: 3.0
  height_tolerance:
    abs_m: 6.0
    rel: 0.5
  height_mismatch_factor: 0.5
imagery:
  providers:
  - id: synthetic_ortho
    type: local_raster
    paths:
    - data/imagery/ortho.tif
    allow_automated_analysis: true
    licence_ref: SYNTHETIC-TEST-001
    capture_date: '2025-01-15'
    priority: 1
  crop:
    buffer_m: 15.0
    min_size_m: 60.0
    enlarge_factor: 1.6
    max_edge_retries: 1
  max_gsd_m: 0.6
  clustering_eps_m: 500.0
segmentation:
  backend: auto
  model: sam2.1_hiera_base_plus
  cpu_fallback_model: sam2.1_hiera_small
  use_cpu_fallback: false
  checkpoints_dir: C:\Users\dhana\Downloads\AIQGIS\data\models
  device: auto
  torch_threads: 0
  positive_points: 3
  interior_erosion_m: 2.0
  box_pad_m: 2.0
  embedding_cache_size: 16
  variant_tie_tolerance: 0.02
  auto_mask:
    points_per_side: 16
    min_area_m2: 20.0
    max_area_m2: 20000.0
    min_compactness: 0.35
polygon:
  min_hole_area_m2: 4.0
  morph_open_px: 1
  regularize: true
  regularize_params:
    simplify_px: 1.7
    parallel_threshold: 1.0
    allow_45_degree: true
    diagonal_threshold_reduction: 15
    allow_circles: false
  simplify_pixel_factor: 0.5
validation:
  area_m2:
  - 15.0
  - 20000.0
  edge_touch_px: 2
  footprint_agreement_iou: 0.6
  approved_overlap_ratio: 0.1
  sliver_width_m: 1.0
  sliver_loss_ratio: 0.15
  sliver_min_length_m: 4.0
confidence:
  historic_identity_prob: 0.95
  geometry_prior:
    historic: 0.95
    OpenStreetMap: 0.85
    Esri Community Maps: 0.85
    default: 0.75
  flag_penalty: 0.85
  calibration_file: null
routing:
  shadow_mode: true
  auto_accept_enabled: false
  t_auto: 0.9
  audit_sample_rate: 0.05
corrected_coordinate:
  strategy: centroid_if_inside
  decimals: 6
  keep_original_if_inside: false
worker:
  host: 127.0.0.1
  port: 8765
